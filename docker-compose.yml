services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: books_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d books_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  discovery-server:
    build: ./services/discovery-server
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "127.0.0.1:8761:8761"

  book-service:
    build: ./services/book-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/books_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  review-service:
    build: ./services/review-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reviews_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  api-gateway:
    build: ./services/api-gateway
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - discovery-server
      - book-service
      - review-service

  auth-service:
    build:
      context: ./services/auth-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_ADMIN_ENABLED: ${DEMO_ADMIN_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
