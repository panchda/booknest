spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: book-service-route
              uri: lb://book-service
              predicates:
                - Path=/api/v1/books/**,/api/v1/books

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
