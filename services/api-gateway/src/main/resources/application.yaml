spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: book-service-route
              uri: lb://book-service
              predicates:
                - Path=/api/v1/books/**,/api/v1/books
            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/api/v1/reviews,/api/v1/reviews/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
