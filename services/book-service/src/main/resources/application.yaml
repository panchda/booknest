spring:
  application:
    name: book-service

  datasource:
    url: jdbc:postgresql://localhost:5433/books_db
    username: ${DB_USERNAME:booknest}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  cache:
    type: caffeine
    cache-names: books
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

server:
  port: 8081
